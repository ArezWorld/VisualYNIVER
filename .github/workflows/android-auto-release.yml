name: Android Stable Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          chmod +x ./gradlew
          sed -i 's/\r$//' ./gradlew

      - name: Prepare release metadata
        shell: bash
        run: |
          BASE_SERIES="1.7"
          IS_PRERELEASE="false"

          git fetch --tags --force
          MAX_PATCH=-1
          while IFS= read -r TAG; do
            if [[ "$TAG" =~ ^v${BASE_SERIES}\.([0-9]+)$ ]]; then
              PATCH_NUMBER="${BASH_REMATCH[1]}"
              if [[ "$PATCH_NUMBER" =~ ^[0-9]+$ ]] && [ "$PATCH_NUMBER" -gt "$MAX_PATCH" ]; then
                MAX_PATCH="$PATCH_NUMBER"
              fi
            fi
          done < <(git tag -l "v${BASE_SERIES}*" --sort=-v:refname)

          NEXT_PATCH=$((MAX_PATCH + 1))
          APP_VERSION_NAME="${BASE_SERIES}.${NEXT_PATCH}"
          APP_VERSION_CODE=$((17000 + NEXT_PATCH))
          TAG_NAME="v${APP_VERSION_NAME}"

          echo "APP_VERSION_NAME=${APP_VERSION_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${APP_VERSION_CODE}" >> "$GITHUB_ENV"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> "$GITHUB_ENV"
          echo "APK_NAME=AOT-${APP_VERSION_NAME}.apk" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon clean assembleRelease --stacktrace
        env:
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}

      - name: Prepare APK artifact
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: AOT ${{ env.TAG_NAME }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          body: |
            ## Release Notes
            Stable AOT release build.

            - App version: `${{ env.APP_VERSION_NAME }}`
            - Release type: `stable`
            - Commit: `${{ github.sha }}`

            ## Changes
            `${{ github.event.head_commit.message }}`

            ## Known Issues
            - On some devices, POI icons can appear with a short delay after very rapid zooming.
            - If a generated report file is open in Word, automatic overwrite may fail until the file is closed.

            ## Files
            - `${{ env.APK_NAME }}` - stable release APK
          files: |
            ${{ env.APK_NAME }}
