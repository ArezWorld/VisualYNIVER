plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

def baseVersionSeries = "1.6"
def defaultVersionPatch = 1
def defaultVersionCode = 16001
def envVersionName = System.getenv("APP_VERSION_NAME")
def envVersionCodeRaw = System.getenv("APP_VERSION_CODE")
def envVersionCode = envVersionCodeRaw?.isInteger() ? envVersionCodeRaw.toInteger() : null
def resolvedVersionName = (envVersionName != null && !envVersionName.trim().isEmpty()) ?
        envVersionName.trim() :
        "${baseVersionSeries}.${defaultVersionPatch}"
def resolvedVersionCode = envVersionCode != null ? envVersionCode : defaultVersionCode

android {
    namespace 'com.aot.taskmap'
    compileSdk 34

    defaultConfig {
        applicationId "com.aot.taskmap"
        minSdk 26
        targetSdk 34
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        buildConfigField 'String', 'UPDATE_REPO_OWNER', '"ArezWorld"'
        buildConfigField 'String', 'UPDATE_REPO_NAME', '"VisualYNIVER"'
        buildConfigField 'String', 'UPDATE_RELEASES_API', '"https://api.github.com/repos/ArezWorld/VisualYNIVER/releases?per_page=20"'
        buildConfigField 'String', 'UPDATE_RELEASES_PAGE', '"https://github.com/ArezWorld/VisualYNIVER/releases"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Activity & Fragment KTX
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    
    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    
    // OSMDroid (OpenStreetMap)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    
    // Google Play Services Location
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    // Image crop for profile avatar
    implementation 'com.github.yalantis:ucrop:2.2.8'
    
    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    
    // OkHttp for API
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
