name: Android Auto Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          chmod +x ./gradlew
          sed -i 's/\r$//' ./gradlew

      - name: Prepare release metadata
        shell: bash
        run: |
          BASE_SERIES="1.6"
          IS_PRERELEASE="true"

          git fetch --tags --force
          LAST_STABLE_TAG=$(git tag -l "v${BASE_SERIES}.*" --sort=-v:refname | grep -E "^v${BASE_SERIES}\\.[0-9]+$" | head -n1 || true)
          if [ -z "$LAST_STABLE_TAG" ]; then
            NEXT_PATCH=1
          else
            LAST_PATCH=${LAST_STABLE_TAG##*.}
            if [[ "$LAST_PATCH" =~ ^[0-9]+$ ]]; then
              NEXT_PATCH=$((LAST_PATCH + 1))
            else
              NEXT_PATCH=1
            fi
          fi

          APP_VERSION_NAME="${BASE_SERIES}.${NEXT_PATCH}"
          APP_VERSION_CODE=$((16000 + NEXT_PATCH))
          TAG_NAME="v${APP_VERSION_NAME}"

          echo "APP_VERSION_NAME=${APP_VERSION_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${APP_VERSION_CODE}" >> "$GITHUB_ENV"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> "$GITHUB_ENV"
          echo "APK_NAME=AOT-${APP_VERSION_NAME}.apk" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace
        env:
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}

      - name: Prepare APK artifact
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: AOT ${{ env.TAG_NAME }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          body: |
            ## Release Notes
            Automatic AOT build from the latest commit.

            - App version: `${{ env.APP_VERSION_NAME }}`
            - Release type: `${{ env.IS_PRERELEASE == 'true' && 'pre-release' || 'stable' }}`
            - Commit: `${{ github.sha }}`

            ## Changes
            `${{ github.event.head_commit.message }}`

            ## Files
            - `${{ env.APK_NAME }}` - current APK build
          files: |
            ${{ env.APK_NAME }}

      - name: Mark all releases as pre-release
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            for (const release of releases) {
              if (release.draft || release.prerelease) {
                continue;
              }

              core.info(`Marking ${release.tag_name} as prerelease`);
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                prerelease: true
              });
            }
